<div id="chat-panel"></div>
<div class="toast" id="toast"></div>
<script>
/* ===== Firebase ===== */
const DB_URL  = 'https://deroule-gj-2026-default-rtdb.europe-west1.firebasedatabase.app';
const DB_PATH = 'deroule-7q4m2x';
/* ==================== */

const ONLINE   = !!DB_URL;
const endpoint = DB_URL.replace(/\/$/, '') + '/' + DB_PATH + '.json';
const LOCK_TTL = 120000;
const PWD      = 'clownard';

const DEFAULT_TYPES = {
  discours:  {label:'Discours',        emoji:'🎤'},
  rituel:    {label:'Rituel',          emoji:'🕯️'},
  activite:  {label:'Activité',        emoji:'🎲'},
  musique:   {label:'Musique',         emoji:'🎵'},
  alliances: {label:'Alliances',       emoji:'💍'},
  entree:    {label:'Entrée / sortie', emoji:'🚪'},
  autre:     {label:'Autre',           emoji:'•'},
};
const DEFAULT_QUI = {q1:'Tanguy',q2:'Bastos',q3:'Tanguy & Bastos',q4:'Témoin',q5:'Parent',q6:'Mariés',q7:'Tous'};
const COLS      = {deroule:'Déroulé final', valide:'Idées validées', a_trancher:'Idées à discuter'};
const COL_ORDER = ['deroule','valide','a_trancher'];
const EMOJIS      = [{k:'up',e:'👍'},{k:'down',e:'👎'},{k:'lol',e:'😂'},{k:'heart',e:'♥️'},{k:'angry',e:'😡'}];
const TYPE_COLORS          = ['#6F8274','#765B62','#C98578','#A8B5A0','#5A7060','#9A7080','#8A6E50','#4E6858'];
const TYPE_COLORS_CLOWNARD = ['#e91e8c','#ff9800','#6c5ce7','#00c853','#00b4d8','#f72585','#fd79a8','#a29bfe'];

const uid     = () => Math.random().toString(36).slice(2, 9);
const quiList = q  => String(q||'').split(',').map(s=>s.trim()).filter(Boolean);

let myPseudo = (localStorage.getItem('ceremonie_auth')==='1')
  ? (localStorage.getItem('ceremonie_pseudo')||'') : '';
let R = null, S = null, editing = null;
let inflight = 0, chain = Promise.resolve(), deferred = false;
let status = ONLINE ? 'wait' : 'demo';
let chatOpen = false;
let typingTimer = null;
let scriptMode = false;
let menuOpen   = false;
const scriptOpen = new Set();
const notesOpen  = new Set();
let jourJMode = false, jourJIndex = 0, jourJTimer = null, jourJBlockStartTs = null;
let jourJPaused = false, jourJPausedElapsed = 0, jourJTotalElapsed = 0;
let pendingScrollToCol = null, pendingScrollToCard = null;
let theme = localStorage.getItem('ceremonie_theme')||'light';
function applyTheme(){ document.documentElement.className = theme==='light'?'':theme; }
function setTheme(t){ const prev=theme; theme=t; localStorage.setItem('ceremonie_theme',t); applyTheme(); render(); if(t==='clownard'&&prev!=='clownard') clownardSplash(); }
function clownardSplash(){
  const PIECES=['🤡','🎉','🎊','🎈','✨','🌈','💥','🎭','🎪','🃏'];
  const overlay=document.createElement('div'); overlay.id='clownard-splash';
  overlay.innerHTML=`<div class="splash-msg">🤡 Bienvenue dans le<br>mode clownard<br> énorme clownard ! 🤡</div><div class="splash-hint">Clique pour continuer</div>`;
  document.body.appendChild(overlay);
  // confettis
  for(let i=0;i<60;i++){
    const p=document.createElement('span'); p.className='confetti-piece';
    p.textContent=PIECES[Math.floor(Math.random()*PIECES.length)];
    p.style.left=Math.random()*100+'vw';
    p.style.fontSize=(1.2+Math.random()*2)+'rem';
    const dur=1.5+Math.random()*2.5;
    p.style.animationDuration=dur+'s';
    p.style.animationDelay=(Math.random()*1.2)+'s';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), (dur+1.5)*1000);
  }
  const dismiss=()=>{ overlay.style.transition='opacity .25s'; overlay.style.opacity='0'; setTimeout(()=>overlay.remove(),280); };
  overlay.addEventListener('click', dismiss);
  setTimeout(dismiss, 4000);
}
applyTheme();
const SCRIPT_SPEAKER_COLORS = [
  ['#d7eaf5','#1b3d6a'],
  ['#fde8dc','#7a3209'],
  ['#e0f5e8','#1d5433'],
  ['#f5e8f5','#6a1a6a'],
  ['#fff4d6','#7a5a00'],
  ['#fce8e8','#8a1a1a'],
  ['#e8f7f7','#1a5a5a'],
];

const B = (id,titre,type,duree,qui,colonne,extra={}) =>
  ({id,titre,type,duree,qui,colonne,musique:'',materiel:'',notes:'',script:'',createdBy:'',...extra});

function defaultDoc(){
  return {types:DEFAULT_TYPES, qui:DEFAULT_QUI, blocs:{}, users:{}, locks:{}, chat:{}, votes:{}, startTime:'15:00', typing:{}, sharedNotes:{}, checklist:{}};
}

/* ── Normalisation ── */
const nb = b => {
  const block = Object.assign({titre:'',type:'autre',duree:0,qui:'',colonne:'',
    musique:'',materiel:'',notes:'',script:'',pos:0,createdBy:''}, b);
  if(!block.colonne) block.colonne = (b.statut==='ok') ? 'deroule' : 'a_trancher';
  if(Array.isArray(block.qui)) block.qui = block.qui.join(',');
  else if(typeof block.qui==='object'&&block.qui!==null) block.qui = Object.values(block.qui).join(',');
  if(block.qui==='—') block.qui = '';
  return block;
};

function view(){
  const d = R||{};
  const types = (d.types&&!Array.isArray(d.types)) ? d.types : DEFAULT_TYPES;
  const qui   = (d.qui  &&!Array.isArray(d.qui))   ? d.qui   : DEFAULT_QUI;
  return {
    types, qui,
    quiArr: Object.values(qui),
    blocs: Object.values(d.blocs||{}).map(nb).sort((a,b)=>a.pos-b.pos)
  };
}

/* ── Synchronisation ── */
const sj = o => JSON.stringify(o,(k,v) =>
  v&&typeof v==='object'&&!Array.isArray(v)
    ? Object.keys(v).sort().reduce((a,k2)=>(a[k2]=v[k2],a),{}) : v);

function setPath(obj,path,val){
  const ks=path.split('/'); let o=obj;
  for(let i=0;i<ks.length-1;i++){
    if(typeof o[ks[i]]!=='object'||o[ks[i]]===null) o[ks[i]]={};
    o=o[ks[i]];
  }
  if(val===null) delete o[ks[ks.length-1]]; else o[ks[ks.length-1]]=val;
}

function send(method,body){
  if(!ONLINE) return; inflight++;
  chain = chain
    .then(()=>fetch(endpoint,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}))
    .then(r=>{if(!r.ok)throw new Error(r.status);})
    .catch(()=>{setStatus('err');toast('Échec de synchronisation');})
    .then(()=>{inflight--;if(inflight===0)refresh();});
}

function update(patch){
  for(const[p,v] of Object.entries(patch)) setPath(R,p,v);
  send('PATCH',patch);
  if(editing && Object.keys(patch).every(p=>p.startsWith('blocs/'+editing+'/'))){
    updateSettingsIfOpen(); return;
  }
  render();
  updateSettingsIfOpen();
}

function sendSilent(patch){
  for(const[p,v] of Object.entries(patch)) setPath(R,p,v);
  send('PATCH',patch);
}

function replaceAll(doc){ R=doc; send('PUT',doc); render(); }

function isEditing(){
  const a=document.activeElement;
  return !!(a&&a.closest&&(a.closest('#app')||a.closest('#add-overlay'))
    &&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=='checkbox');
}

async function refresh(){
  if(!ONLINE||inflight>0) return;
  try{
    const r=await fetch(endpoint,{cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    const d=await r.json();
    if(inflight>0) return;
    setStatus('ok');
    if(d===null){R=defaultDoc();send('PUT',R);render();return;}
    if(R&&sj(d)===sj(R)) return;
    if(R&&isEditing()){deferred=true;return;}
    const wasLoaded=R!==null;
    R=d; render();
    if(wasLoaded){
      const el=document.getElementById('sync');
      if(el){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');}
    }
  }catch(e){setStatus('err');}
}

function listen(){
  if(!ONLINE||typeof EventSource==='undefined') return;
  const es=new EventSource(endpoint);
  es.addEventListener('put',refresh); es.addEventListener('patch',refresh);
  es.onopen=()=>setStatus('ok'); es.onerror=()=>setStatus('err');
}

document.addEventListener('focusout',()=>{if(deferred){deferred=false;setTimeout(refresh,0);}});
setInterval(refresh,15000);

function setStatus(s){
  status=s;
  const el=document.getElementById('sync');
  if(el){el.className='sync '+s;el.textContent=syncLabel();}
}
const syncLabel=()=>({ok:'● Synchronisé',err:'○ Hors ligne',wait:'○ Connexion…',demo:'◌ Mode démo'}[status]);

/* ── Utilitaires ── */
const esc = s => String(s??'').replace(/[&<>"']/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const blocsParCol = col => S.blocs.filter(b=>b.colonne===col);

function optHTML(obj,cur){
  return Object.entries(obj)
    .map(([k,v])=>{
      const label = typeof v==='object' ? v.emoji+' '+v.label : v;
      return `<option value="${k}" ${k===cur?'selected':''}>${esc(label)}</option>`;
    }).join('');
}

function typeDistrib(blocs,types){
  const byType={}; let total=0;
  blocs.forEach(b=>{byType[b.type]=(byType[b.type]||0)+(b.duree||0);total+=b.duree||0;});
  if(!total) return [];
  return Object.entries(byType).sort((a,b)=>b[1]-a[1])
    .map(([k,min])=>({
      key:k,
      emoji:(types[k]||{emoji:'•'}).emoji,
      label:(types[k]||{label:k}).label,
      pct:Math.round(min/total*100)
    }));
}

function calcEndTime(startHHMM, totalMin){
  const parts=(startHHMM||'15:00').split(':');
  const end = parseInt(parts[0]||15)*60 + parseInt(parts[1]||0) + totalMin;
  return String(Math.floor(end/60)%24).padStart(2,'0')+'h'+String(end%60).padStart(2,'0');
}

function fmtDur(min){
  if(min<60) return min+'min';
  const h=Math.floor(min/60), m=min%60;
  return m ? h+'h'+String(m).padStart(2,'0') : h+'h';
}

function timeAt(hhmmStr, addMin){
  const parts=(hhmmStr||'15:00').split(':');
  const total=parseInt(parts[0]||15)*60+parseInt(parts[1]||0)+addMin;
  return String(Math.floor(total/60)%24).padStart(2,'0')+'h'+String(total%60).padStart(2,'0');
}

function quiDistrib(blocs){
  const q={Tanguy:0,Bastos:0};
  blocs.forEach(b=>{
    const ql=quiList(b.qui), n=ql.length||1;
    ql.forEach(name=>{
      if(name==='Tanguy')  q.Tanguy +=(b.duree||0)/n;
      if(name==='Bastos')  q.Bastos +=(b.duree||0)/n;
    });
  });
  return q;
}

function knownUsers(){
  const names=new Set();
  if(R&&R.users) Object.values(R.users).forEach(n=>n&&names.add(n));
  if(R&&R.blocs) Object.values(R.blocs).forEach(b=>b.createdBy&&names.add(b.createdBy));
  return [...names].sort();
}

/* ── Verrous ── */
function lockInfo(blockId){
  if(!R||!R.locks) return null;
  const lock=R.locks[blockId];
  if(!lock) return null;
  if((Date.now()-lock.since)>=LOCK_TTL) return null;
  return lock;
}

function setEditing(id){
  if(editing&&editing!==id&&ONLINE) sendSilent({['locks/'+editing]:null});
  editing=id;
  if(id&&ONLINE&&myPseudo) sendSilent({['locks/'+id]:{by:myPseudo,since:Date.now()}});
  render();
}

window.addEventListener('beforeunload',()=>{
  if(!ONLINE) return;
  const patch={};
  if(editing) patch['locks/'+editing]=null;
  if(myPseudo) patch['typing/'+myPseudo]=null;
  if(Object.keys(patch).length){
    try{
      const xhr=new XMLHttpRequest();
      xhr.open('PATCH',endpoint,false);
      xhr.setRequestHeader('Content-Type','application/json');
      xhr.send(JSON.stringify(patch));
    }catch(_){}
  }
});

/* ── Votes sur les blocs ── */
function blockVotes(blockId){
  if(!R||!R.votes||!R.votes[blockId]) return {up:{},down:{}};
  const v=R.votes[blockId];
  return {up:v.up||{}, down:v.down||{}};
}

function toggleVote(blockId,dir){
  if(!myPseudo){toast('Choisis ton pseudo d\'abord.');return;}
  const v=blockVotes(blockId);
  const existing=v[dir][myPseudo];
  sendSilent({['votes/'+blockId+'/'+dir+'/'+myPseudo]: existing?null:true});
  render();
}

function showWhoVoted(blockId,dir){
  const v=blockVotes(blockId);
  const names=Object.keys(v[dir]);
  if(!names.length) return;
  toast((dir==='up'?'👍':'👎')+' '+names.join(', '));
}

/* ── Déplacement ── */
function moveToCol(id,newCol,targetId,after){
  const colBlocs=S.blocs.filter(b=>b.colonne===newCol&&b.id!==id);
  let pos;
  if(targetId===null){
    pos=colBlocs.length?colBlocs[colBlocs.length-1].pos+1:1;
  }else{
    const j=colBlocs.findIndex(b=>b.id===targetId);
    if(j<0){pos=colBlocs.length?colBlocs[colBlocs.length-1].pos+1:1;}
    else{
      const prev=after?colBlocs[j]:colBlocs[j-1];
      const next=after?colBlocs[j+1]:colBlocs[j];
      pos=prev&&next?(prev.pos+next.pos)/2:prev?prev.pos+1:next?next.pos-1:1;
    }
  }
  const patch={['blocs/'+id+'/pos']:pos};
  const cur=S.blocs.find(b=>b.id===id);
  if(cur&&cur.colonne!==newCol) patch['blocs/'+id+'/colonne']=newCol;
  update(patch);
}

/* ── Popup ajout bloc ── */
function showAddOverlay(defaultCol){
  if(!S) return;
  const col = defaultCol || 'a_trancher';
  const ov  = document.getElementById('add-overlay');
  ov.innerHTML=`<div class="modal modal-add">
    <div class="modal-hd">
      <h2>Nouveau bloc</h2>
      <button class="modal-close" data-act="closeAdd">✕</button>
    </div>
    <div class="add-form-main">
      <div><label>Titre *</label><input type="text" id="af-titre" placeholder="Nom du bloc…" autocomplete="off"></div>
      <div class="add-row-2">
        <div><label>Type</label><select id="af-type">${optHTML(S.types,'autre')}</select></div>
        <div><label>Durée (min)</label><input type="number" min="0" max="120" id="af-duree" value="5"></div>
      </div>
      <div><label>Qui</label><div class="qui-checks">${
        S.quiArr.map(name=>`<label><input type="checkbox" class="af-qui" value="${esc(name)}"> ${esc(name)}</label>`).join('')
      }</div></div>
      <div><label>Colonne</label><select id="af-col">${optHTML(COLS,col)}</select></div>
    </div>
    <details class="add-details">
      <summary>Détails optionnels</summary>
      <div class="add-form-extra">
        <div><label>Musique</label><input type="text" id="af-musique" autocomplete="off"></div>
        <div><label>Matériel</label><input type="text" id="af-materiel" autocomplete="off"></div>
        <div><label>Notes</label><textarea id="af-notes" style="min-height:60px"></textarea></div>
      </div>
    </details>
    <div class="modal-actions">
      <button class="pri" data-act="confirmAdd">Créer →</button>
      <button data-act="closeAdd">Annuler</button>
    </div>
  </div>`;
  ov.style.display='flex';
  const titreEl=document.getElementById('af-titre');
  titreEl?.addEventListener('keydown',e=>{if(e.key==='Enter')confirmAdd();});
  setTimeout(()=>titreEl?.focus(),100);
}

function confirmAdd(){
  const titre=(document.getElementById('af-titre')?.value||'').trim();
  if(!titre){toast('Donne un titre au bloc.');document.getElementById('af-titre')?.focus();return;}
  const type    = document.getElementById('af-type')?.value||'autre';
  const duree   = Math.max(0,parseInt(document.getElementById('af-duree')?.value)||0);
  const qui     = [...document.querySelectorAll('.af-qui:checked')].map(el=>el.value).join(',');
  const colonne = document.getElementById('af-col')?.value||'a_trancher';
  const musique = (document.getElementById('af-musique')?.value||'').trim();
  const materiel= (document.getElementById('af-materiel')?.value||'').trim();
  const notes   = (document.getElementById('af-notes')?.value||'').trim();

  const nid     = 'b'+uid();
  const colBlocs= S.blocs.filter(b=>b.colonne===colonne);
  const pos     = colBlocs.reduce((m,b)=>Math.max(m,b.pos),0)+1;
  const newBlock= {...B(nid,titre,type,duree,qui,colonne),pos,createdBy:myPseudo,musique,materiel,notes};

  document.getElementById('add-overlay').style.display='none';
  update({['blocs/'+nid]:newBlock});
}

/* ── Typing indicator ── */
function getTypists(){
  if(!R||!R.typing) return [];
  const now=Date.now();
  return Object.entries(R.typing)
    .filter(([name,ts])=>name!==myPseudo&&(now-ts)<4000)
    .map(([name])=>name);
}

function startTyping(){
  if(!myPseudo||!ONLINE) return;
  sendSilent({['typing/'+myPseudo]:Date.now()});
  clearTimeout(typingTimer);
  typingTimer=setTimeout(stopTyping, 2500);
}

function stopTyping(){
  clearTimeout(typingTimer); typingTimer=null;
  if(!myPseudo||!ONLINE) return;
  sendSilent({['typing/'+myPseudo]:null});
}

function updateTypingIndicator(){
  const el=document.getElementById('typing-indicator');
  if(!el) return;
  const t=getTypists();
  el.textContent=t.length ? t.join(', ')+(t.length>1?' sont':' est')+' en train d\'écrire…' : '';
}

/* ── Chat ── */
function chatLRKey(){ return 'chat_lr_'+(myPseudo||'anon'); }
function getChatLR(){ return parseInt(localStorage.getItem(chatLRKey())||'0'); }
function setChatLR(ts){ localStorage.setItem(chatLRKey(),ts); }

function chatMessages(){
  if(!R||!R.chat) return [];
  return Object.entries(R.chat).map(([id,m])=>({id,...m})).sort((a,b)=>a.ts-b.ts);
}

function chatUnread(){
  if(!myPseudo) return 0;
  const lr=getChatLR();
  return chatMessages().filter(m=>m.ts>lr&&m.by!==myPseudo).length;
}

function renderChatBtn(){
  const btn=document.getElementById('chat-btn');
  if(!btn) return;
  btn.style.display=chatOpen?'none':'flex';
  const n=chatUnread();
  btn.innerHTML='💬'+(n>0?`<span class="chat-badge">${n}</span>`:'');
}

function renderChat(){
  const panel=document.getElementById('chat-panel');
  if(!panel) return;
  if(!chatOpen){ panel.style.display='none'; return; }

  const prevInput=document.getElementById('chat-input')?.value||'';
  const prevFocused=document.activeElement?.id==='chat-input';
  const msgsEl0=document.getElementById('chat-msgs');
  const wasAtBottom=!msgsEl0||(msgsEl0.scrollHeight-msgsEl0.scrollTop-msgsEl0.clientHeight<80);

  panel.style.display='flex';

  const msgs=chatMessages();
  if(msgs.length){
    const maxTs=Math.max(...msgs.map(m=>m.ts));
    if(maxTs>getChatLR()) setChatLR(maxTs);
  }
  renderChatBtn();

  const msgHTML=msgs.length?msgs.map(m=>{
    const isMe=m.by===myPseudo;
    const reactions=m.reactions||{};
    const reactionHTML=EMOJIS.map(({k,e})=>{
      const users=reactions[k]?Object.keys(reactions[k]):[];
      const count=users.length;
      const mine=myPseudo&&reactions[k]&&reactions[k][myPseudo];
      const cls='react-btn'+(mine?' mine':'')+(count>0?' has-count':'');
      return `<button class="${cls}" data-act="react" data-mid="${m.id}" data-ek="${k}">${e}${count>0?` <span>${count}</span>`:''}</button>`;
    }).join('');
    return `<div class="chat-msg${isMe?' me':''}">
      <div class="msg-by">${esc(m.by)}</div>
      <div class="msg-bubble">${esc(m.text)}</div>
      <div class="msg-reactions">${reactionHTML}</div>
    </div>`;
  }).join(''):'<p class="chat-empty">Pas encore de messages.</p>';

  panel.innerHTML=`
    <div class="chat-hd">
      <span class="chat-title">💬 Chat en direct</span>
      <button class="modal-close" data-act="closeChat">✕</button>
    </div>
    <div class="chat-msgs" id="chat-msgs">${msgHTML}</div>
    <div class="typing-indicator" id="typing-indicator"></div>
    <div class="chat-input-row">
      <input type="text" id="chat-input" placeholder="Message…" autocomplete="off">
      <button class="pri sm" data-act="sendChat">Envoyer</button>
    </div>`;

  const inputEl=document.getElementById('chat-input');
  if(inputEl&&prevInput) inputEl.value=prevInput;
  if(prevFocused) inputEl?.focus();
  inputEl?.addEventListener('keydown',e=>{if(e.key==='Enter')doSendChat();});
  inputEl?.addEventListener('input',startTyping);
  updateTypingIndicator();

  const msgsEl=document.getElementById('chat-msgs');
  if(msgsEl&&wasAtBottom) msgsEl.scrollTop=msgsEl.scrollHeight;
}

function doSendChat(){

/* ── Script ── */
function renderScript(text){
  if(!text||!text.trim()) return '<span class="sr-empty">Aucun script.</span>';
  const quiArr = S ? S.quiArr : Object.values(DEFAULT_QUI);
  return text.split('\n').map(line=>{
    if(!line.trim()) return '<div class="sr-gap"></div>';
    const colonIdx = line.indexOf(':');
    if(colonIdx > 0){
      const prefix = line.slice(0, colonIdx).trim();
      const rest   = line.slice(colonIdx + 1).trim();
      if(rest){
        let idx = -1;
        if(prefix === 'T')      idx = 0;
        else if(prefix === 'B') idx = 1;
        else { const i = quiArr.indexOf(prefix); if(i >= 0) idx = i; }
        if(idx >= 0){
          const short = (quiArr[idx]||prefix).slice(0,2).toUpperCase();
          return `<div class="sr-line sr-q${idx}"><span class="sr-who">${esc(short)}</span><span class="sr-text">${esc(rest)}</span></div>`;
        }
      }
    }
    return `<div class="sr-line sr-dir"><span class="sr-text">${esc(line)}</span></div>`;
  }).join('');
}

/* ── Mode Répétition ── */
function updateJourJTimer(){
  const el=document.getElementById('jj-timer');
  if(!el){if(jourJTimer){clearInterval(jourJTimer);jourJTimer=null;}return;}
  const elapsed=jourJPaused?jourJPausedElapsed:jourJBlockStartTs?Math.floor((Date.now()-jourJBlockStartTs)/1000):0;
  if(!jourJPaused && jourJBlockStartTs) jourJTotalElapsed++;
  const deroule=S?blocsParCol('deroule'):[];
  const b=deroule[jourJIndex];
  const expected=(b?(b.duree||0):0)*60;
  const pct=expected>0?elapsed/expected:0;
  el.style.color=pct<0.8?'var(--ok)':pct<1?'#c48a00':'var(--warn)';
  el.textContent=Math.floor(elapsed/60)+'\''+String(elapsed%60).padStart(2,'0');
  const tot=document.getElementById('jj-total');
  if(tot) tot.textContent=Math.floor(jourJTotalElapsed/60)+'\''+String(jourJTotalElapsed%60).padStart(2,'0');
}

function startJourJTimer(){
  if(jourJTimer) return;
  jourJTimer=setInterval(updateJourJTimer,1000);
}

function stopJourJTimer(){
  if(jourJTimer){clearInterval(jourJTimer);jourJTimer=null;}
}

function renderJourJ(){
  if(!S) return '';
  const deroule=blocsParCol('deroule');
  if(!deroule.length) return '<div class="jj-view"><p style="padding:20px;color:var(--mut)">Aucun bloc dans le déroulé final.</p></div>';
  const idx=Math.min(jourJIndex,deroule.length-1);
  const b=deroule[idx];
  const typeInfo=S.types[b.type]||{emoji:'•'};
  const qui=quiList(b.qui);
  const isFirst=idx===0, isLast=idx===deroule.length-1;
  const prevMin=deroule.slice(0,idx).reduce((s,x)=>s+(x.duree||0),0);
  const startT=timeAt(R.startTime||'15:00',prevMin);
  const endT=timeAt(R.startTime||'15:00',prevMin+(b.duree||0));
  const nextBloc=!isLast?deroule[idx+1]:null;
  const nextTypeInfo=nextBloc?(S.types[nextBloc.type]||{emoji:'•'}):null;
  return `<div class="jj-view">
    <div class="jj-hd noprint">
      <button class="sm ghost" data-act="exitJourJ">✕ Quitter</button>
      <span class="jj-progress">${idx+1} / ${deroule.length}</span>

      <span class="jj-total-wrap">⏱ <span id="jj-total" class="jj-total">0'00</span> total</span>

    </div>

        ${qui.map(q=>`<span class="chip">${esc(q)}</span>`).join('')}
        <span class="jj-dur">${fmtDur(b.duree||0)}</span>
      </div>
      <div class="jj-timer-wrap noprint">
        <span id="jj-timer" class="jj-timer">0'00</span>
        <span class="jj-timer-label">/ ${fmtDur(b.duree||0)}</span>
        <div class="jj-timer-btns">
          <button class="sm ghost" data-act="${jourJPaused?'jourJResume':'jourJPause'}" title="${jourJPaused?'Reprendre':'Pause'}">${jourJPaused?(jourJPausedElapsed===0?'▶ Démarrer':'▶'):'⏸'}</button>
          <button class="sm ghost" data-act="jourJRestart" title="Recommencer le bloc">↺</button>
        </div>
      </div>

      const _t=_newCols.querySelector(`[data-col="${pendingScrollToCol}"]`);
      if(_t) _newCols.scrollLeft=_t.offsetLeft;
      pendingScrollToCol=null;
    } else {
      _newCols.scrollLeft=_savedScroll;
    }
  }
  if(pendingScrollToCard && window.innerWidth>780){
    const _cid=pendingScrollToCard;
    requestAnimationFrame(()=>{
      const _cardEl=document.querySelector(`.card[data-id="${_cid}"]`);
      if(_cardEl) _cardEl.scrollIntoView({behavior:'smooth',block:'nearest'});
    });
  }
  pendingScrollToCard=null;
  initColDots();
}

function initColDots(){
  const cols=document.querySelector('.columns');
  const dots=[...document.querySelectorAll('.col-dot')];
  if(!cols||!dots.length) return;
  const colEls=[...cols.querySelectorAll('.col')];
  const update=()=>{
    const idx=colEls.reduce((best,col,i)=>
      Math.abs(col.offsetLeft-cols.scrollLeft)<Math.abs(colEls[best].offsetLeft-cols.scrollLeft)?i:best,0);
    dots.forEach((d,i)=>d.classList.toggle('active',i===idx));
  };
  update();
  cols.addEventListener('scroll',update,{passive:true});
}

/* ── Interactions ── */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, id=el.dataset.id;

  // Fermer le menu mobile automatiquement sur toute action sauf openMenu/closeMenu
  if(menuOpen && act!=='openMenu' && act!=='closeMenu'){
    menuOpen=false; renderMobileMenu();
  }

  if(act==='up'||act==='down'){
    const b=S.blocs.find(x=>x.id===id); if(!b) return;
    const col=blocsParCol(b.colonne), k=col.findIndex(x=>x.id===id);
    if(act==='up'&&k>0)              { pendingScrollToCard=id; moveToCol(id,b.colonne,col[k-1].id,false); }
    if(act==='down'&&k<col.length-1) { pendingScrollToCard=id; moveToCol(id,b.colonne,col[k+1].id,true); }
  }
  else if(act==='colLeft'||act==='colRight'){
    const b=S.blocs.find(x=>x.id===id); if(!b) return;
    const idx=COL_ORDER.indexOf(b.colonne);
    const newIdx=act==='colLeft'?idx-1:idx+1;
    if(newIdx>=0&&newIdx<COL_ORDER.length){
      pendingScrollToCol=COL_ORDER[newIdx];
      pendingScrollToCard=id;
      moveToCol(id,COL_ORDER[newIdx],null,true);
    }
  }
  else if(act==='edit'){
    const lock=lockInfo(id);
    if(lock&&lock.by!==myPseudo){toast('🔒 '+lock.by+' modifie ce bloc.');return;}
    setEditing(editing===id?null:id);
  }
  else if(act==='del'){
    if(confirm('Supprimer ce bloc ?')){
      if(editing===id) setEditing(null);
      update({['blocs/'+id]:null,['locks/'+id]:null});
    }
  }
  else if(act==='addNote'){
    const text=(document.getElementById('new-note-text')?.value||'').trim();
    if(!text){toast('Écris quelque chose.');return;}
    if(!myPseudo){toast('Choisis ton pseudo d\'abord.');return;}
    update({['sharedNotes/n'+uid()]:{by:myPseudo,text,ts:Date.now()}});
  }
  else if(act==='delNote'){
    const note=R.sharedNotes?.[el.dataset.nid];
    if(note&&note.by===myPseudo) update({['sharedNotes/'+el.dataset.nid]:null});
  }
  else if(act==='openAdd')   showAddOverlay();
  else if(act==='closeAdd')  document.getElementById('add-overlay').style.display='none';
  else if(act==='confirmAdd') confirmAdd();
  else if(act==='vote')      toggleVote(id, el.dataset.dir);
  else if(act==='whoVoted')  showWhoVoted(id||el.dataset.id, el.dataset.dir);
  else if(act==='addType'){
    const emoji=(document.getElementById('new-type-emoji')?.value||'•').trim();
    const label=(document.getElementById('new-type-label')?.value||'').trim();
    if(!label){toast('Donne un nom au type.');return;}
    update({['types/t'+uid()]:{label,emoji}});
    if(document.getElementById('new-type-label')) document.getElementById('new-type-label').value='';
    if(document.getElementById('new-type-emoji')) document.getElementById('new-type-emoji').value='';
  }
  else if(act==='delType'){
    const key=el.dataset.key;
    if(S.blocs.some(b=>b.type===key)){toast('Ce type est utilisé dans des blocs.');return;}
    update({['types/'+key]:null});
  }
  else if(act==='addQui'){
    const name=(document.getElementById('new-qui')?.value||'').trim();
    if(!name){toast('Saisis un nom.');return;}
    update({['qui/q'+uid()]:name});
    if(document.getElementById('new-qui')) document.getElementById('new-qui').value='';
  }
  else if(act==='delQui'){
    const key=el.dataset.key, name=S.qui[key];
    if(S.blocs.some(b=>quiList(b.qui).includes(name))){toast('Ce nom est utilisé dans des blocs.');return;}
    update({['qui/'+key]:null});
  }
  else if(act==='openSettings')  showSettings();
  else if(act==='closeSettings') document.getElementById('settings-overlay').style.display='none';
  else if(act==='changePseudo'){
    const prev=myPseudo;
    myPseudo=''; localStorage.removeItem('ceremonie_pseudo'); localStorage.removeItem('ceremonie_auth');
    showPseudoOverlay(prev);
  }
  else if(act==='toggleScript'){
    if(scriptOpen.has(id)) scriptOpen.delete(id); else scriptOpen.add(id);
    render();
  }
  else if(act==='toggleNote'){
    if(notesOpen.has(id)) notesOpen.delete(id); else notesOpen.add(id);
    render();
  }
  else if(act==='toggleScriptMode'){
    scriptMode=!scriptMode;
    if(scriptMode){jourJMode=false;stopJourJTimer();}
    render();
  }
  else if(act==='toggleJourJ'){
    if(jourJMode){jourJMode=false;stopJourJTimer();}
    else{jourJMode=true;scriptMode=false;jourJIndex=0;jourJBlockStartTs=null;jourJPaused=true;jourJPausedElapsed=0;jourJTotalElapsed=0;}
    render();
  }
  else if(act==='exitJourJ'){
    jourJMode=false;stopJourJTimer();render();
  }
  else if(act==='jourJNext'){
    const deroule=blocsParCol('deroule');
    if(jourJIndex<deroule.length-1){jourJIndex++;jourJBlockStartTs=Date.now();jourJPaused=false;jourJPausedElapsed=0;startJourJTimer();}
    render();
  }
  else if(act==='jourJPrev'){
    if(jourJIndex>0){jourJIndex--;jourJBlockStartTs=Date.now();jourJPaused=false;jourJPausedElapsed=0;startJourJTimer();}
    render();
  }
  else if(act==='jourJPause'){
    jourJPausedElapsed=jourJBlockStartTs?Math.floor((Date.now()-jourJBlockStartTs)/1000):0;
    jourJPaused=true; stopJourJTimer(); render();
  }
  else if(act==='jourJResume'){
    jourJPaused=false; jourJBlockStartTs=Date.now()-jourJPausedElapsed*1000;
    startJourJTimer(); render();
  }
  else if(act==='jourJRestart'){
    jourJPaused=false; jourJPausedElapsed=0; jourJBlockStartTs=Date.now();
    startJourJTimer(); render();
  }
  else if(act==='jourJReset'){
    jourJIndex=0; jourJPaused=true; jourJPausedElapsed=0; jourJBlockStartTs=null; jourJTotalElapsed=0;
    stopJourJTimer(); render();
  }
  else if(act==='goHome'){
    if(scriptMode||jourJMode){ scriptMode=false; jourJMode=false; stopJourJTimer(); render(); }
  }
  else if(act==='toggleTheme'){
    setTheme(theme==='light'?'dark':theme==='dark'?'clownard':'light');
  }
  else if(act==='resetChecklist'){
    if(confirm('Tout décocher ?')){
      const patch={};
      S.blocs.filter(b=>b.materiel.trim()).forEach(b=>{if(R.checklist&&R.checklist[b.id])patch['checklist/'+b.id]=null;});
      if(Object.keys(patch).length) update(patch);
    }
  }
  else if(act==='openMenu'){
    menuOpen=true; renderMobileMenu();
  }
  else if(act==='closeMenu'){
    menuOpen=false; renderMobileMenu();
  }
  else if(act==='insertSpeaker'){
    const ta=document.querySelector(`.script-ta[data-id="${id}"]`);
    if(!ta) return;
    const who=el.dataset.who;
    const prefix=who?who+': ':'';
    const val=ta.value;
    const pos=ta.selectionStart;
    // Bornes de la ligne courante
    const lineStart=val.lastIndexOf('\n',pos-1)+1;
    const lineEndRaw=val.indexOf('\n',pos);
    const lineEnd=lineEndRaw===-1?val.length:lineEndRaw;
    const curLine=val.slice(lineStart,lineEnd);
    // La ligne a-t-elle déjà un préfixe connu ?
    const quiArr=S?S.quiArr:[];
    const ci=curLine.indexOf(':');
    const hasPrefix=ci>0&&(()=>{const p=curLine.slice(0,ci).trim();return p==='T'||p==='B'||quiArr.includes(p);})();
    let newVal,newCursor;
    if(hasPrefix||curLine.trim()!==''){
      // Aller à la ligne suivante avec le nouveau préfixe
      const ins='\n'+prefix;
      newVal=val.slice(0,lineEnd)+ins+val.slice(lineEnd);
      newCursor=lineEnd+ins.length;
    }else{
      // Ligne vide : poser le préfixe directement
      newVal=val.slice(0,lineStart)+prefix+val.slice(lineEnd);
      newCursor=lineStart+prefix.length;
    }
    ta.value=newVal;
    ta.focus();
    ta.selectionStart=ta.selectionEnd=newCursor;
    const preview=ta.closest('.script-panel')?.querySelector('.script-preview');
    if(preview) preview.innerHTML=renderScript(newVal);
    update({['blocs/'+id+'/script']:newVal});
  }
  else if(act==='toggleChat'){
    chatOpen=!chatOpen;
    renderChat();
    if(chatOpen){
      setTimeout(()=>{
        const m=document.getElementById('chat-msgs');
        if(m) m.scrollTop=m.scrollHeight;
        document.getElementById('chat-input')?.focus();
      },50);
    }
    renderChatBtn();
  }
  else if(act==='closeChat'){
    chatOpen=false; stopTyping();
    renderChat(); renderChatBtn();
  }
  else if(act==='sendChat') doSendChat();
  else if(act==='react')    toggleReaction(el.dataset.mid, el.dataset.ek);
  else if(act==='print')    window.print();
  else if(act==='reset'){
    if(myPseudo!=='Tanguy'){toast('Seul Tanguy peut réinitialiser.');return;}
    if(confirm('Tout remettre à zéro pour tout le monde ?')){
      if(editing) setEditing(null);
      replaceAll(defaultDoc());
    }
  }
});

/* ── Drag & Drop ── */
let dragId=null, dragStartX=0, dragStartY=0, dragMoved=false;

function placeDropLine(refEl, before){
  document.getElementById('drop-line')?.remove();
  const line=document.createElement('div');
  line.id='drop-line'; line.className='drop-line';
  if(before) refEl.before(line); else refEl.after(line);
}
function removeDropLine(){ document.getElementById('drop-line')?.remove(); }

let dragScrollDir=0, dragScrollRaf=null;
function doDragScroll(){
  if(!dragId||dragScrollDir===0){dragScrollRaf=null;return;}
  window.scrollBy(0,dragScrollDir*10);
  dragScrollRaf=requestAnimationFrame(doDragScroll);
}

document.addEventListener('dragstart',e=>{
  const c=e.target.closest('.card'); if(!c) return;
  if(e.target.closest('textarea,input,select')) return;
  dragId=c.dataset.id; dragStartX=e.clientX; dragStartY=e.clientY; dragMoved=false;
  c.classList.add('drag');
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',dragId);
});

document.addEventListener('dragover',e=>{
  if(!dragId) return;
  const zone=90, newDir=e.clientY<zone?-1:e.clientY>window.innerHeight-zone?1:0;
  if(newDir!==dragScrollDir){dragScrollDir=newDir;if(newDir&&!dragScrollRaf)dragScrollRaf=requestAnimationFrame(doDragScroll);}
  if(Math.abs(e.clientX-dragStartX)>8||Math.abs(e.clientY-dragStartY)>8) dragMoved=true;
  const col=e.target.closest('.col'); if(!col) return;
  e.preventDefault();

  document.querySelectorAll('.col').forEach(c=>c.classList.remove('drag-over'));
  col.classList.add('drag-over');

  const card=e.target.closest('.card');
  if(card&&card.dataset.id!==dragId&&card.id!=='drop-line'){
    const r=card.getBoundingClientRect();
    const isBefore=e.clientY<=r.top+r.height/2;
    placeDropLine(card,isBefore);
  } else if(!card){
    const body=col.querySelector('.col-body');
    if(body){
      const cards=[...body.querySelectorAll('.card:not(.drag)')];
      if(cards.length) placeDropLine(cards[cards.length-1],false);
    }
  }
});

document.addEventListener('dragleave',e=>{
  const col=e.target.closest('.col');
  if(col&&!col.contains(e.relatedTarget)){
    col.classList.remove('drag-over');
    removeDropLine();
  }
});

document.addEventListener('drop',e=>{
  const col=e.target.closest('.col'); if(!dragId||!col||!dragMoved) return;
  e.preventDefault();
  const dropLineEl=document.getElementById('drop-line');
  document.querySelectorAll('.col').forEach(c=>c.classList.remove('drag-over'));
  removeDropLine();
  const id=dragId; dragId=null;
  const newColonne=col.dataset.col;
  const card=e.target.closest('.card');
  if(card&&card.dataset.id!==id){
    const r=card.getBoundingClientRect();
    moveToCol(id,newColonne,card.dataset.id,e.clientY>r.top+r.height/2);
  } else if(dropLineEl&&col.contains(dropLineEl)){
    const prev=dropLineEl.previousElementSibling;
    const next=dropLineEl.nextElementSibling;
    if(prev?.dataset?.id&&prev.dataset.id!==id) moveToCol(id,newColonne,prev.dataset.id,true);
    else if(next?.dataset?.id&&next.dataset.id!==id) moveToCol(id,newColonne,next.dataset.id,false);
    else moveToCol(id,newColonne,null,true);
  }
  // pas de drop-line = pas de cible valide → rien
});

document.addEventListener('dragend',()=>{ dragId=null; dragMoved=false; dragScrollDir=0; dragScrollRaf=null; removeDropLine(); render(); });

/* ── Touch Drag & Drop ── */
let touchDragId=null, touchClone=null, touchDragActive=false, touchLongPressTimer=null;
let touchStartX=0, touchStartY=0, touchOffsetX=0, touchOffsetY=0;
let touchPendingColTarget=null;

function touchCleanup(){
  dragScrollDir=0; dragScrollRaf=null;
  touchPendingColTarget=null;
  removeColZoneOverlay();
  document.querySelectorAll('.col').forEach(c=>c.classList.remove('drag-over'));
  removeDropLine();
  if(touchClone){touchClone.remove();touchClone=null;}
  if(touchDragId){
    const c=document.querySelector(`.card[data-id="${touchDragId}"]`);
    if(c){c.classList.remove('drag');c.style.opacity='';}
  }
  touchDragId=null; touchDragActive=false;
}

document.addEventListener('touchstart',e=>{
  const card=e.target.closest('.card');
  if(!card||e.target.closest('textarea,input,select,button,.voir-plus-btn,.vote-btn,.script-tog,.act')) return;
  const t=e.touches[0];
  touchStartX=t.clientX; touchStartY=t.clientY;
  touchLongPressTimer=setTimeout(()=>{
    touchDragId=card.dataset.id;
    touchDragActive=true;
    navigator.vibrate?.(40);
    const rect=card.getBoundingClientRect();
    touchOffsetX=t.clientX-rect.left;
    touchOffsetY=t.clientY-rect.top;
    touchClone=card.cloneNode(true);
    touchClone.querySelectorAll('.noprint,.form').forEach(el=>el.remove());
    touchClone.style.cssText=`position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;opacity:.88;pointer-events:none;z-index:9000;transform:scale(1.04) rotate(1.5deg);box-shadow:0 12px 32px rgba(0,0,0,.25);border-radius:12px;`;
    document.body.appendChild(touchClone);
    card.classList.add('drag'); card.style.opacity='.25';
  },350);
},{passive:true});

function getTouchColZone(clientX){
  const w=window.innerWidth, edge=w*0.25;
  if(clientX<edge) return 'left';
  if(clientX>w-edge) return 'right';
  return null;
}
function getColZoneTarget(currentColonne, zone){
  const idx=COL_ORDER.indexOf(currentColonne);
  if(zone==='left'&&idx>0) return COL_ORDER[idx-1];
  if(zone==='right'&&idx<COL_ORDER.length-1) return COL_ORDER[idx+1];
  return null;
}
function showColZoneOverlay(zone, colKey){
  removeColZoneOverlay();
  if(!zone||!colKey) return;
  const ov=document.createElement('div'); ov.id='col-zone-ov';
  const label=COLS[colKey]||colKey;
  ov.style.cssText=`position:fixed;top:0;bottom:0;${zone==='left'?'left:0':'right:0'};width:18%;background:rgba(111,130,116,.22);border-${zone==='left'?'right':'left'}:3px solid var(--acc);z-index:8999;display:flex;align-items:center;justify-content:center;pointer-events:none;`;
  ov.innerHTML=`<span style="writing-mode:vertical-rl;font-size:.75rem;font-weight:800;color:var(--acc);letter-spacing:.08em;text-transform:uppercase;padding:8px">${label}</span>`;
  document.body.appendChild(ov);
}
function removeColZoneOverlay(){ document.getElementById('col-zone-ov')?.remove(); }

document.addEventListener('touchmove',e=>{
  if(touchLongPressTimer&&!touchDragActive){
    const t=e.touches[0];
    if(Math.abs(t.clientX-touchStartX)>10||Math.abs(t.clientY-touchStartY)>10){
      clearTimeout(touchLongPressTimer); touchLongPressTimer=null;
    }
    return;
  }
  if(!touchDragActive||!touchClone) return;
  e.preventDefault();
  const t=e.touches[0];
  touchClone.style.left=(t.clientX-touchOffsetX)+'px';
  touchClone.style.top=(t.clientY-touchOffsetY)+'px';
  // inter-column zone overlay
  const b=S?.blocs.find(b=>b.id===touchDragId);
  const hZone=getTouchColZone(t.clientX);
  const colTarget=b?getColZoneTarget(b.colonne,hZone):null;
  touchPendingColTarget=colTarget;
  showColZoneOverlay(hZone,colTarget);
  if(hZone){ removeDropLine(); return; }
  // intra-column drop line
  touchClone.style.pointerEvents='none';
  const under=document.elementFromPoint(t.clientX,t.clientY);
  document.querySelectorAll('.col').forEach(c=>c.classList.remove('drag-over'));
  removeDropLine();
  const col=under?.closest('.col');
  if(col){
    col.classList.add('drag-over');
    const targetCard=under?.closest('.card');
    if(targetCard&&targetCard.dataset.id!==touchDragId){
      placeDropLine(targetCard,t.clientY<=targetCard.getBoundingClientRect().top+targetCard.getBoundingClientRect().height/2);
    } else {
      const cards=[...col.querySelectorAll('.col-body .card:not(.drag)')];
      if(cards.length) placeDropLine(cards[cards.length-1],false);
    }
  }
},{passive:false});

document.addEventListener('touchend',e=>{
  clearTimeout(touchLongPressTimer); touchLongPressTimer=null;
  if(!touchDragActive) return;
  const t=e.changedTouches[0];
  removeColZoneOverlay();
  if(Math.abs(t.clientX-touchStartX)<15&&Math.abs(t.clientY-touchStartY)<15){touchCleanup();return;}
  // check inter-column zone (use last known target from touchmove)
  if(touchPendingColTarget&&touchDragId){
    moveToCol(touchDragId,touchPendingColTarget,null,true);
    touchPendingColTarget=null; touchCleanup(); return;
  }
  // normal intra-column drop
  if(touchClone) touchClone.style.display='none';
  const under=document.elementFromPoint(t.clientX,t.clientY);
  const col=under?.closest('.col');
  if(col&&touchDragId){
    const newColonne=col.dataset.col;
    const targetCard=under.closest('.card');
    if(targetCard&&targetCard.dataset.id!==touchDragId){
      const r=targetCard.getBoundingClientRect();
      moveToCol(touchDragId,newColonne,targetCard.dataset.id,t.clientY>r.top+r.height/2);
    } else {
      moveToCol(touchDragId,newColonne,null,true);
    }
  }
  touchCleanup();
},{passive:true});

document.addEventListener('touchcancel',()=>{
  clearTimeout(touchLongPressTimer); touchLongPressTimer=null;
  touchCleanup();
});

/* ── Konami → Mode Clownard ── */
const KONAMI=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
let konamiIdx=0;
document.addEventListener('keydown',e=>{
  if(e.key===KONAMI[konamiIdx]){
    konamiIdx++;
    if(konamiIdx===KONAMI.length){
      konamiIdx=0;
      setTheme('clownard');
    }
  } else { konamiIdx=e.key===KONAMI[0]?1:0; }
});

window.addEventListener('scroll',()=>{
  document.querySelector('.sticky-hd')?.classList.toggle('scrolled',window.scrollY>20);
},{passive:true});

/* ── Init ── */
(async function init(){
  if(!ONLINE){R=defaultDoc();render();return;}
  render();
  await refresh();
  listen();
})();
</script>
</body>
